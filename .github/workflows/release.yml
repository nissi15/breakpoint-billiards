name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the game attached.
# The file keeps the same name in every release, so
# .../releases/latest/download/breakpoint-billiards.exe always works.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/release/breakpoint-billiards.exe
