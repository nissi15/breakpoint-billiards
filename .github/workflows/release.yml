name: Release

# Push a tag like v1.0.0 to publish a GitHub release with a Windows
# installer and a portable zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Portable zip
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/breakpoint-billiards.exe, README.md, LICENSE, install.ps1, install.cmd, uninstall.ps1 dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/BreakpointBilliards-$v-windows-x64.zip"

      - name: Installer
        shell: pwsh
        continue-on-error: true
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/breakpoint.iss

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/*-Setup.exe
